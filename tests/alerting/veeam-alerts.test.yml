# Logic tests for the Grafana alert rules in alerting/veeam-alerts.json, run by
# tests/Alerts.Tests.ps1. promtool cannot read Grafana rules, so the test writes
# veeam-alerts.rules.yml next to a copy of this file: one Prometheus rule per
# Grafana rule, with query A and the threshold of B combined into one expression,
# the same for and the severity label. That selects the same series as the
# Grafana rule. Annotations are not part of it (Grafana templates use $values).
# promtool lists only firing alerts, so exp_alerts: [] also covers pending ones.
rule_files:
  - veeam-alerts.rules.yml

evaluation_interval: 1m

tests:
  - name: jobs, objects, repositories and license
    interval: 1m
    input_series:
      # Failed and idle: fires after 45m.
      - series: 'veeam_job_last_result{instance="vbr01:9182",job="windows",job_name="Failed Job",job_type="VSphereBackup"}'
        values: '2x120'
      - series: 'veeam_job_running{instance="vbr01:9182",job="windows",job_name="Failed Job"}'
        values: '0x120'
      # Failed but running again (retry): no VeeamJobFailed.
      - series: 'veeam_job_last_result{instance="vbr01:9182",job="windows",job_name="Retrying Job",job_type="VSphereBackup"}'
        values: '2x120'
      - series: 'veeam_job_running{instance="vbr01:9182",job="windows",job_name="Retrying Job"}'
        values: '1x120'
      - series: 'veeam_job_last_result{instance="vbr01:9182",job="windows",job_name="Warning Job",job_type="BackupCopy"}'
        values: '1x120'
      - series: 'veeam_job_last_result{instance="vbr01:9182",job="windows",job_name="Good Job",job_type="VSphereBackup"}'
        values: '0x120'
      - series: 'veeam_object_last_result{instance="vbr01:9182",job="windows",job_name="Failed Job",object="vm02"}'
        values: '2x120'
      - series: 'veeam_object_last_result{instance="vbr01:9182",job="windows",job_name="Failed Job",object="vm01"}'
        values: '0x120'
      # 90 % full: fires after 1h.
      - series: 'veeam_repository_capacity_bytes{instance="vbr01:9182",job="windows",repository="repo-full",repository_type="WinLocal",host="srv1"}'
        values: '100x120'
      - series: 'veeam_repository_free_bytes{instance="vbr01:9182",job="windows",repository="repo-full",repository_type="WinLocal",host="srv1"}'
        values: '10x120'
      # 50 % full: no alert.
      - series: 'veeam_repository_capacity_bytes{instance="vbr01:9182",job="windows",repository="repo-ok",repository_type="WinLocal",host="srv1"}'
        values: '100x120'
      - series: 'veeam_repository_free_bytes{instance="vbr01:9182",job="windows",repository="repo-ok",repository_type="WinLocal",host="srv1"}'
        values: '50x120'
      # Object storage without capacity: no alert.
      - series: 'veeam_repository_capacity_bytes{instance="vbr01:9182",job="windows",repository="s3",repository_type="AmazonS3"}'
        values: '0x120'
      - series: 'veeam_repository_free_bytes{instance="vbr01:9182",job="windows",repository="s3",repository_type="AmazonS3"}'
        values: '0x120'
      - series: 'veeam_repository_online{instance="vbr01:9182",job="windows",repository="repo-offline"}'
        values: '0x120'
      - series: 'veeam_repository_online{instance="vbr01:9182",job="windows",repository="repo-full"}'
        values: '1x120'
      # Expires 10 days after t=0 on vbr01, 100 days on vbr02, expired at t=0 on vbr03.
      - series: 'veeam_license_expiration_timestamp_seconds{instance="vbr01:9182",job="windows"}'
        values: '864000x120'
      - series: 'veeam_license_expiration_timestamp_seconds{instance="vbr02:9182",job="windows"}'
        values: '8640000x120'
      - series: 'veeam_license_expiration_timestamp_seconds{instance="vbr03:9182",job="windows"}'
        values: '0x120'
    alert_rule_test:
      - eval_time: 44m
        alertname: VeeamJobFailed
        exp_alerts: []
      - eval_time: 46m
        alertname: VeeamJobFailed
        exp_alerts:
          - exp_labels: {severity: warning, instance: 'vbr01:9182', job: windows, job_name: Failed Job, job_type: VSphereBackup}
      - eval_time: 46m
        alertname: VeeamJobWarning
        exp_alerts:
          - exp_labels: {severity: warning, instance: 'vbr01:9182', job: windows, job_name: Warning Job, job_type: BackupCopy}
      - eval_time: 44m
        alertname: VeeamObjectFailed
        exp_alerts: []
      - eval_time: 46m
        alertname: VeeamObjectFailed
        exp_alerts:
          - exp_labels: {severity: critical, instance: 'vbr01:9182', job: windows, job_name: Failed Job, object: vm02}
      - eval_time: 59m
        alertname: VeeamRepositoryFull
        exp_alerts: []
      - eval_time: 61m
        alertname: VeeamRepositoryFull
        exp_alerts:
          - exp_labels: {severity: warning, instance: 'vbr01:9182', job: windows, repository: repo-full, repository_type: WinLocal, host: srv1}
      - eval_time: 14m
        alertname: VeeamRepositoryOffline
        exp_alerts: []
      - eval_time: 16m
        alertname: VeeamRepositoryOffline
        exp_alerts:
          - exp_labels: {severity: critical, instance: 'vbr01:9182', job: windows, repository: repo-offline}
      - eval_time: 5m
        alertname: VeeamLicenseExpiring
        exp_alerts:
          - exp_labels: {severity: warning, instance: 'vbr01:9182', job: windows}
          - exp_labels: {severity: warning, instance: 'vbr03:9182', job: windows}

  - name: jobs not run for 26 hours
    interval: 1m
    input_series:
      # Last run at t=0: fires 1h after it is 26h old.
      - series: 'veeam_job_last_run_timestamp_seconds{instance="vbr01:9182",job="windows",job_name="Old Job"}'
        values: '0x1700'
      - series: 'veeam_job_enabled{instance="vbr01:9182",job="windows",job_name="Old Job"}'
        values: '1x1700'
      # Just as old, but disabled.
      - series: 'veeam_job_last_run_timestamp_seconds{instance="vbr01:9182",job="windows",job_name="Disabled Job"}'
        values: '0x1700'
      - series: 'veeam_job_enabled{instance="vbr01:9182",job="windows",job_name="Disabled Job"}'
        values: '0x1700'
      # Runs all the time: the last run is always now.
      - series: 'veeam_job_last_run_timestamp_seconds{instance="vbr01:9182",job="windows",job_name="Busy Job"}'
        values: '0+60x1700'
      - series: 'veeam_job_enabled{instance="vbr01:9182",job="windows",job_name="Busy Job"}'
        values: '1x1700'
      # Just as old, but without a schedule (started by hand): no alert.
      - series: 'veeam_job_last_run_timestamp_seconds{instance="vbr01:9182",job="windows",job_name="Manual Job"}'
        values: '0x1700'
      - series: 'veeam_job_enabled{instance="vbr01:9182",job="windows",job_name="Manual Job"}'
        values: '1x1700'
      # Just as old, chained after another job: alerts like a scheduled job.
      - series: 'veeam_job_last_run_timestamp_seconds{instance="vbr01:9182",job="windows",job_name="Chained Job"}'
        values: '0x1700'
      - series: 'veeam_job_enabled{instance="vbr01:9182",job="windows",job_name="Chained Job"}'
        values: '1x1700'
      # Just as old, from an exporter without the schedule label: alerts as before.
      - series: 'veeam_job_last_run_timestamp_seconds{instance="vbr02:9182",job="windows",job_name="Old Exporter Job"}'
        values: '0x1700'
      - series: 'veeam_job_enabled{instance="vbr02:9182",job="windows",job_name="Old Exporter Job"}'
        values: '1x1700'
      - series: 'veeam_job_info{instance="vbr01:9182",job="windows",job_name="Old Job",schedule="scheduled"}'
        values: '1x1700'
      - series: 'veeam_job_info{instance="vbr01:9182",job="windows",job_name="Disabled Job",schedule="scheduled"}'
        values: '1x1700'
      - series: 'veeam_job_info{instance="vbr01:9182",job="windows",job_name="Busy Job",schedule="scheduled"}'
        values: '1x1700'
      - series: 'veeam_job_info{instance="vbr01:9182",job="windows",job_name="Manual Job",schedule="none"}'
        values: '1x1700'
      - series: 'veeam_job_info{instance="vbr01:9182",job="windows",job_name="Chained Job",schedule="chained"}'
        values: '1x1700'
      - series: 'veeam_job_info{instance="vbr02:9182",job="windows",job_name="Old Exporter Job"}'
        values: '1x1700'
    alert_rule_test:
      - eval_time: 27h
        alertname: VeeamJobNotRun
        exp_alerts: []
      - eval_time: 27h5m
        alertname: VeeamJobNotRun
        exp_alerts:
          - exp_labels: {severity: warning, instance: 'vbr01:9182', job: windows, job_name: Old Job}
          - exp_labels: {severity: warning, instance: 'vbr01:9182', job: windows, job_name: Chained Job}
          - exp_labels: {severity: warning, instance: 'vbr02:9182', job: windows, job_name: Old Exporter Job}

  - name: stale exporter files
    interval: 1m
    input_series:
      # Written at t=0 and never again.
      - series: 'windows_textfile_mtime_seconds{instance="vbr01:9182",job="windows",file="C:\\Program Files\\windows_exporter\\textfile_inputs\\veeam_jobs.prom"}'
        values: '0x2900'
      - series: 'windows_textfile_mtime_seconds{instance="vbr01:9182",job="windows",file="C:\\Program Files\\windows_exporter\\textfile_inputs\\veeam_license.prom"}'
        values: '0x2900'
      # Written on every run, but not covered by the rules.
      - series: 'windows_textfile_mtime_seconds{instance="vbr01:9182",job="windows",file="C:\\Program Files\\windows_exporter\\textfile_inputs\\veeam_exporter.prom"}'
        values: '0x2900'
      # Fresh.
      - series: 'windows_textfile_mtime_seconds{instance="vbr01:9182",job="windows",file="C:\\Program Files\\windows_exporter\\textfile_inputs\\veeam_objects.prom"}'
        values: '0+60x2900'
    alert_rule_test:
      - eval_time: 60m
        alertname: VeeamExporterStale
        exp_alerts: []
      - eval_time: 61m
        alertname: VeeamExporterStale
        exp_alerts:
          - exp_labels: {severity: warning, instance: 'vbr01:9182', job: windows, file: 'C:\Program Files\windows_exporter\textfile_inputs\veeam_jobs.prom'}
      - eval_time: 48h
        alertname: VeeamExporterLicenseStale
        exp_alerts: []
      - eval_time: 48h1m
        alertname: VeeamExporterLicenseStale
        exp_alerts:
          - exp_labels: {severity: warning, instance: 'vbr01:9182', job: windows, file: 'C:\Program Files\windows_exporter\textfile_inputs\veeam_license.prom'}

  - name: scheduled jobs that never ran
    interval: 1m
    input_series:
      # Enabled, scheduled, never ran (no last run timestamp): fires after 26h.
      - series: 'veeam_job_last_result{instance="vbr01:9182",job="windows",job_name="New Job",job_type="VSphereBackup"}'
        values: '-1x1600'
      - series: 'veeam_job_enabled{instance="vbr01:9182",job="windows",job_name="New Job"}'
        values: '1x1600'
      - series: 'veeam_job_info{instance="vbr01:9182",job="windows",job_name="New Job",schedule="scheduled"}'
        values: '1x1600'
      # Chained after a job that never runs: fires as well.
      - series: 'veeam_job_last_result{instance="vbr01:9182",job="windows",job_name="Chained Job",job_type="FileBackup"}'
        values: '-1x1600'
      - series: 'veeam_job_enabled{instance="vbr01:9182",job="windows",job_name="Chained Job"}'
        values: '1x1600'
      - series: 'veeam_job_info{instance="vbr01:9182",job="windows",job_name="Chained Job",schedule="chained"}'
        values: '1x1600'
      # Without a schedule (started by hand): no alert.
      - series: 'veeam_job_last_result{instance="vbr01:9182",job="windows",job_name="Manual Job",job_type="FileBackup"}'
        values: '-1x1600'
      - series: 'veeam_job_enabled{instance="vbr01:9182",job="windows",job_name="Manual Job"}'
        values: '1x1600'
      - series: 'veeam_job_info{instance="vbr01:9182",job="windows",job_name="Manual Job",schedule="none"}'
        values: '1x1600'
      # Disabled: no alert.
      - series: 'veeam_job_last_result{instance="vbr01:9182",job="windows",job_name="Disabled Job",job_type="VSphereBackup"}'
        values: '-1x1600'
      - series: 'veeam_job_enabled{instance="vbr01:9182",job="windows",job_name="Disabled Job"}'
        values: '0x1600'
      - series: 'veeam_job_info{instance="vbr01:9182",job="windows",job_name="Disabled Job",schedule="scheduled"}'
        values: '1x1600'
      # Ran recently, result unknown (-1): has a last run timestamp, no alert from either rule.
      - series: 'veeam_job_last_result{instance="vbr01:9182",job="windows",job_name="Unknown Result Job",job_type="VSphereBackup"}'
        values: '-1x1600'
      - series: 'veeam_job_last_run_timestamp_seconds{instance="vbr01:9182",job="windows",job_name="Unknown Result Job"}'
        values: '0+60x1600'
      - series: 'veeam_job_enabled{instance="vbr01:9182",job="windows",job_name="Unknown Result Job"}'
        values: '1x1600'
      - series: 'veeam_job_info{instance="vbr01:9182",job="windows",job_name="Unknown Result Job",schedule="scheduled"}'
        values: '1x1600'
      # From an exporter without the schedule label: alerts like a scheduled job.
      - series: 'veeam_job_last_result{instance="vbr02:9182",job="windows",job_name="Old Exporter Job",job_type="VSphereBackup"}'
        values: '-1x1600'
      - series: 'veeam_job_enabled{instance="vbr02:9182",job="windows",job_name="Old Exporter Job"}'
        values: '1x1600'
      - series: 'veeam_job_info{instance="vbr02:9182",job="windows",job_name="Old Exporter Job"}'
        values: '1x1600'
      # 30 minutes without data after 20 hours (reboot): two quarter hours are
      # missing, the rule fires 30 minutes later instead of starting again.
      - series: 'veeam_job_last_result{instance="vbr03:9182",job="windows",job_name="Gap Job",job_type="VSphereBackup"}'
        values: '-1x1200 _x30 -1x370'
      - series: 'veeam_job_enabled{instance="vbr03:9182",job="windows",job_name="Gap Job"}'
        values: '1x1200 _x30 1x370'
      - series: 'veeam_job_info{instance="vbr03:9182",job="windows",job_name="Gap Job",schedule="scheduled"}'
        values: '1x1200 _x30 1x370'
    alert_rule_test:
      # 104 of the quarter hours of the last 28 hours = 26 hours (0 to 25h45m).
      - eval_time: 25h44m
        alertname: VeeamJobNeverRun
        exp_alerts: []
      - eval_time: 25h46m
        alertname: VeeamJobNeverRun
        exp_alerts:
          - exp_labels: {severity: warning, instance: 'vbr01:9182', job: windows, job_name: New Job, job_type: VSphereBackup}
          - exp_labels: {severity: warning, instance: 'vbr01:9182', job: windows, job_name: Chained Job, job_type: FileBackup}
          - exp_labels: {severity: warning, instance: 'vbr02:9182', job: windows, job_name: Old Exporter Job, job_type: VSphereBackup}
      - eval_time: 26h16m
        alertname: VeeamJobNeverRun
        exp_alerts:
          - exp_labels: {severity: warning, instance: 'vbr01:9182', job: windows, job_name: New Job, job_type: VSphereBackup}
          - exp_labels: {severity: warning, instance: 'vbr01:9182', job: windows, job_name: Chained Job, job_type: FileBackup}
          - exp_labels: {severity: warning, instance: 'vbr02:9182', job: windows, job_name: Old Exporter Job, job_type: VSphereBackup}
          - exp_labels: {severity: warning, instance: 'vbr03:9182', job: windows, job_name: Gap Job, job_type: VSphereBackup}
      - eval_time: 26h1m
        alertname: VeeamJobNotRun
        exp_alerts: []

  - name: data source, collectors and license state
    interval: 1m
    input_series:
      # vbr01 delivered data for an hour, then nothing: VeeamExporterMissing after 15 more minutes.
      - series: 'veeam_exporter_info{instance="vbr01:9182",job="windows",script_version="0.3.0",api_version="1.3-rev2",vbr_version="13.1.2.57"}'
        values: '1x60 _x120'
      # vbr02 keeps delivering; its textfile collector fails from minute 11.
      - series: 'veeam_exporter_info{instance="vbr02:9182",job="windows",script_version="0.3.0",api_version="1.3-rev2",vbr_version="13.1.2.57"}'
        values: '1x180'
      - series: 'windows_exporter_collector_success{collector="textfile",instance="vbr02:9182",job="windows"}'
        values: '1x10 0x170'
      # A server without Veeam data: its textfile collector is not watched.
      - series: 'windows_exporter_collector_success{collector="textfile",instance="web01:9182",job="windows"}'
        values: '0x180'
      # One failed phase of 16 minutes (one run) and one that lasts.
      - series: 'veeam_exporter_collector_success{collector="jobs",instance="vbr02:9182",job="windows"}'
        values: '1x10 0x15 1x10 0x60'
      # The license collector runs once a day: a single failed run stays 0
      # for a day and must not fire with the REST collectors.
      - series: 'veeam_exporter_collector_success{collector="license",instance="vbr02:9182",job="windows"}'
        values: '1x10 0x170'
      - series: 'veeam_license_valid{instance="vbr02:9182",job="windows"}'
        values: '0x90'
      # Support ends after 20 days (vbr02) and after 40 days (vbr03); on vbr04 it ended before the test starts.
      - series: 'veeam_license_support_expiration_timestamp_seconds{instance="vbr02:9182",job="windows"}'
        values: '1728000x90'
      - series: 'veeam_license_support_expiration_timestamp_seconds{instance="vbr03:9182",job="windows"}'
        values: '3456000x90'
      - series: 'veeam_license_support_expiration_timestamp_seconds{instance="vbr04:9182",job="windows"}'
        values: '-864000x90'
    alert_rule_test:
      - eval_time: 79m
        alertname: VeeamExporterMissing
        exp_alerts: []
      - eval_time: 82m
        alertname: VeeamExporterMissing
        exp_alerts:
          - exp_labels: {severity: critical, instance: 'vbr01:9182'}
      - eval_time: 25m
        alertname: VeeamExporterTextfileError
        exp_alerts: []
      - eval_time: 27m
        alertname: VeeamExporterTextfileError
        exp_alerts:
          - exp_labels: {severity: warning, instance: 'vbr02:9182', job: windows, collector: textfile}
      - eval_time: 26m
        alertname: VeeamExporterCollectorFailed
        exp_alerts: []
      - eval_time: 67m
        alertname: VeeamExporterCollectorFailed
        exp_alerts: []
      - eval_time: 69m
        alertname: VeeamExporterCollectorFailed
        exp_alerts:
          - exp_labels: {severity: warning, instance: 'vbr02:9182', job: windows, collector: jobs}
      - eval_time: 170m
        alertname: VeeamExporterLicenseCollectorFailed
        exp_alerts: []
      - eval_time: 59m
        alertname: VeeamLicenseInvalid
        exp_alerts: []
      - eval_time: 61m
        alertname: VeeamLicenseInvalid
        exp_alerts:
          - exp_labels: {severity: critical, instance: 'vbr02:9182', job: windows}
      - eval_time: 5m
        alertname: VeeamSupportExpiring
        exp_alerts:
          - exp_labels: {severity: warning, instance: 'vbr02:9182', job: windows}
          - exp_labels: {severity: warning, instance: 'vbr04:9182', job: windows}

  - name: a silent server and the daily license collector over several days
    interval: 15m
    input_series:
      # vbr01 delivered data for an hour and has been silent since.
      - series: 'veeam_exporter_info{instance="vbr01:9182",job="windows",script_version="0.3.0",api_version="1.3-rev2",vbr_version="13.1.2.57"}'
        values: '1x4 _x800'
      # vbr02: the license collector succeeds on day one and fails from then
      # on (0 from 24h15m, so the second failed run is at 48h15m).
      - series: 'veeam_exporter_collector_success{collector="license",instance="vbr02:9182",job="windows"}'
        values: '1x96 0x700'
      # vbr03: the license collector never succeeded.
      - series: 'veeam_exporter_collector_success{collector="license",instance="vbr03:9182",job="windows"}'
        values: '0x800'
    alert_rule_test:
      # Still firing after a long weekend, gone after the 7 days.
      - eval_time: 3d
        alertname: VeeamExporterMissing
        exp_alerts:
          - exp_labels: {severity: critical, instance: 'vbr01:9182'}
      - eval_time: 6d23h
        alertname: VeeamExporterMissing
        exp_alerts:
          - exp_labels: {severity: critical, instance: 'vbr01:9182'}
      - eval_time: 7d2h
        alertname: VeeamExporterMissing
        exp_alerts: []
      # One failed run passes, the second one fires; never succeeded fires at once.
      - eval_time: 48h
        alertname: VeeamExporterLicenseCollectorFailed
        exp_alerts:
          - exp_labels: {severity: warning, instance: 'vbr03:9182', job: windows, collector: license}
      - eval_time: 49h15m
        alertname: VeeamExporterLicenseCollectorFailed
        exp_alerts:
          - exp_labels: {severity: warning, instance: 'vbr02:9182', job: windows, collector: license}
          - exp_labels: {severity: warning, instance: 'vbr03:9182', job: windows, collector: license}
      - eval_time: 49h15m
        alertname: VeeamExporterCollectorFailed
        exp_alerts: []

  - name: age of the last backup per object
    interval: 5m
    input_series:
      # A nightly job on a pool. Test time 0 is the end of the last good night.
      # pve-stale: last backup at 0, then the VM fails every night.
      - series: 'veeam_object_last_success_timestamp_seconds{instance="vbr01:9182",job="windows",job_name="PVE Pool",object="pve-stale"}'
        values: '0x900'
      - series: 'veeam_object_last_result{instance="vbr01:9182",job="windows",job_name="PVE Pool",object="pve-stale"}'
        values: '0x287 2x613'
      # pve-fresh: backed up again after 24 hours.
      - series: 'veeam_object_last_success_timestamp_seconds{instance="vbr01:9182",job="windows",job_name="PVE Pool",object="pve-fresh"}'
        values: '0x287 86400x613'
      - series: 'veeam_object_last_result{instance="vbr01:9182",job="windows",job_name="PVE Pool",object="pve-fresh"}'
        values: '0x900'
      # pve-excluded: failed in the night after 0, was taken out of the job,
      # and the run after 48 hours no longer processes it: its series end.
      - series: 'veeam_object_last_success_timestamp_seconds{instance="vbr01:9182",job="windows",job_name="PVE Pool",object="pve-excluded"}'
        values: '0x575 _x325'
      - series: 'veeam_object_last_result{instance="vbr01:9182",job="windows",job_name="PVE Pool",object="pve-excluded"}'
        values: '0x287 2x288 _x325'
      # pve-new: added to the pool, never backed up, fails from hour 24 on.
      - series: 'veeam_object_last_result{instance="vbr01:9182",job="windows",job_name="PVE Pool",object="pve-new"}'
        values: '_x287 2x613'
      # pve-first: added to the pool, first backup still running (None).
      - series: 'veeam_object_last_result{instance="vbr01:9182",job="windows",job_name="PVE Pool",object="pve-first"}'
        values: '_x287 -1x613'
    alert_rule_test:
      # 26 hours after the last backup: one missed night.
      - eval_time: 25h45m
        alertname: VeeamObjectBackupTooOld
        exp_alerts: []
      - eval_time: 26h15m
        alertname: VeeamObjectBackupTooOld
        exp_alerts:
          - exp_labels: {severity: critical, instance: 'vbr01:9182', job: windows, job_name: PVE Pool, object: pve-stale}
          - exp_labels: {severity: critical, instance: 'vbr01:9182', job: windows, job_name: PVE Pool, object: pve-excluded}
      # After the next regular run the excluded VM is gone and no longer alerts.
      - eval_time: 49h
        alertname: VeeamObjectBackupTooOld
        exp_alerts:
          - exp_labels: {severity: critical, instance: 'vbr01:9182', job: windows, job_name: PVE Pool, object: pve-stale}
      - eval_time: 49h
        alertname: VeeamObjectFailed
        exp_alerts:
          - exp_labels: {severity: critical, instance: 'vbr01:9182', job: windows, job_name: PVE Pool, object: pve-stale}
          - exp_labels: {severity: critical, instance: 'vbr01:9182', job: windows, job_name: PVE Pool, object: pve-new}
      # No backup at all: only the object that failed, not the one whose first backup runs.
      - eval_time: 24h30m
        alertname: VeeamObjectNoBackup
        exp_alerts: []
      - eval_time: 25h
        alertname: VeeamObjectNoBackup
        exp_alerts:
          - exp_labels: {severity: critical, instance: 'vbr01:9182', job: windows, job_name: PVE Pool, object: pve-new}
      - eval_time: 49h
        alertname: VeeamObjectNoBackup
        exp_alerts:
          - exp_labels: {severity: critical, instance: 'vbr01:9182', job: windows, job_name: PVE Pool, object: pve-new}
