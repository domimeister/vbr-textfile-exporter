name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PESTER_VERSION: 5.7.1
  PSSCRIPTANALYZER_VERSION: 1.24.0
  PROMETHEUS_VERSION: 3.5.0
  # SHA-256 of prometheus-<version>.windows-amd64.zip, from the release's sha256sums.txt
  PROMETHEUS_SHA256: b3c2607d1e80a277735fd3cde86432eb1b6843897cb82fb04fbf4c7ffb1d1c36

jobs:
  test:
    # The rendered job names are the required status checks of the main
    # ruleset: "test (Windows PowerShell 5.1)" and "test (PowerShell 7)".
    # Renaming a job or an edition means updating the ruleset as well.
    name: test (${{ matrix.edition }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: Windows PowerShell 5.1
            id: powershell-5.1
            shell: powershell
            major: 5
          - edition: PowerShell 7
            id: powershell-7
            shell: pwsh
            major: 7
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check PowerShell edition
        env:
          EXPECTED_MAJOR: ${{ matrix.major }}
        run: |
          $PSVersionTable | Format-Table -AutoSize | Out-String -Width 200
          if ($PSVersionTable.PSVersion.Major -ne [int]$env:EXPECTED_MAJOR) {
            throw "Expected PowerShell $env:EXPECTED_MAJOR, got $($PSVersionTable.PSVersion)"
          }

      - name: Install Pester and PSScriptAnalyzer
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          $ProgressPreference = 'SilentlyContinue'
          $modules = [ordered]@{ Pester = $env:PESTER_VERSION; PSScriptAnalyzer = $env:PSSCRIPTANALYZER_VERSION }
          foreach ($name in $modules.Keys) {
            $version = [version]$modules[$name]
            if (Get-Module -ListAvailable -Name $name | Where-Object { $_.Version -eq $version }) {
              Write-Output "$name $version is already installed"
              continue
            }
            Install-Module -Name $name -RequiredVersion $version -Repository PSGallery -Scope CurrentUser -Force -SkipPublisherCheck -AllowClobber
            Write-Output "$name $version installed"
          }

      - name: Install promtool
        # Same binary for both editions, so this step always uses pwsh.
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $name = "prometheus-$env:PROMETHEUS_VERSION.windows-amd64"
          $zip = Join-Path -Path $env:RUNNER_TEMP -ChildPath "$name.zip"
          Invoke-WebRequest -Uri "https://github.com/prometheus/prometheus/releases/download/v$env:PROMETHEUS_VERSION/$name.zip" -OutFile $zip
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
          if ($hash -ne $env:PROMETHEUS_SHA256) { throw "SHA-256 mismatch for $name.zip: $hash" }
          Expand-Archive -LiteralPath $zip -DestinationPath $env:RUNNER_TEMP -Force
          $bin = Join-Path -Path $env:RUNNER_TEMP -ChildPath $name
          & (Join-Path -Path $bin -ChildPath 'promtool.exe') --version
          [System.IO.File]::AppendAllText($env:GITHUB_PATH, "$bin`n")

      - name: Pester
        env:
          # The tests keep a copy of the .prom files they generate here
          # (Export-GeneratedPromFile in tests/TestHelpers.ps1).
          VEEAM_TEST_PROM_OUTPUT: ${{ runner.temp }}/prom-output
        run: |
          Import-Module -Name Pester -RequiredVersion $env:PESTER_VERSION -Force
          Invoke-Pester -Path tests -CI

      - name: Reviewer guard
        # Hook of the reviewer subagent (.claude/hooks/reviewer-guard.sh);
        # Git Bash, independent of the PowerShell edition.
        if: ${{ !cancelled() }}
        shell: bash
        run: bash tests/reviewer-guard.test.sh

      - name: PSScriptAnalyzer
        if: ${{ !cancelled() }}
        run: |
          Import-Module -Name PSScriptAnalyzer -RequiredVersion $env:PSSCRIPTANALYZER_VERSION -Force
          $results = @(foreach ($path in 'src', 'deploy') { Invoke-ScriptAnalyzer -Path $path -Recurse })
          $failing = @('Error', 'ParseError')
          foreach ($r in $results) {
            $level = if ($failing -contains "$($r.Severity)") { 'error' } else { 'warning' }
            $file = (Resolve-Path -LiteralPath $r.ScriptPath -Relative) -replace '^\.[\\/]', '' -replace '\\', '/'
            $message = ('{0} ({1}): {2}' -f $r.RuleName, $r.Severity, $r.Message) -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            Write-Output ('::{0} file={1},line={2}::{3}' -f $level, $file, $r.Line, $message)
          }
          $errors = @($results | Where-Object { $failing -contains "$($_.Severity)" })
          Write-Output ('PSScriptAnalyzer: {0} finding(s), {1} error(s)' -f $results.Count, $errors.Count)
          if ($errors.Count -gt 0) { throw "PSScriptAnalyzer reported $($errors.Count) error(s)" }

      - name: promtool check metrics
        if: ${{ !cancelled() }}
        env:
          VEEAM_TEST_PROM_OUTPUT: ${{ runner.temp }}/prom-output
        run: |
          # Generated by the tests in this run, plus the expected fixtures the
          # collector tests compare their output with byte for byte.
          ./tests/Invoke-PromtoolCheck.ps1 -Path $env:VEEAM_TEST_PROM_OUTPUT, 'tests/fixtures/expected'

      - name: Upload test output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-output-${{ matrix.id }}
          path: |
            testResults.xml
            ${{ runner.temp }}/prom-output
          if-no-files-found: warn
          retention-days: 14
