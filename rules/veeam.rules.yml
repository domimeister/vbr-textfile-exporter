# Prometheus alerting rules for vbr-textfile-exporter.
# Specification: docs/metrics.md, section "Example Alerts". expr, for and
# severity must match it (tests/Rules.Tests.ps1); the thresholds are proposals.
# Unit tests: tests/rules/veeam.rules.test.yml (promtool test rules).
groups:
  - name: veeam
    rules:
      # 45m covers the Veeam retry window (3 x 10 min) plus one script interval.
      - alert: VeeamJobFailed
        expr: veeam_job_last_result == 2 and on(instance, job_name) veeam_job_running == 0
        for: 45m
        labels:
          severity: critical
        annotations:
          summary: 'Job {{ $labels.job_name }} on {{ $labels.instance }} failed'

      - alert: VeeamJobWarning
        expr: veeam_job_last_result == 1
        for: 45m
        labels:
          severity: warning
        annotations:
          summary: 'Job {{ $labels.job_name }} on {{ $labels.instance }} ended with a warning'

      - alert: VeeamObjectFailed
        expr: veeam_object_last_result == 2
        for: 45m
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.object }} in {{ $labels.job_name }} not backed up'

      # Assumes daily jobs. Jobs that never ran have no last run timestamp
      # and do not fire here (docs/metrics.md#OP-10). Jobs without a schedule
      # (schedule="none", started by hand) are skipped; exporters older than
      # the schedule label still alert as before.
      - alert: VeeamJobNotRun
        expr: (time() - veeam_job_last_run_timestamp_seconds) > 26 * 3600 and on(instance, job_name) veeam_job_enabled == 1 and on(instance, job_name) veeam_job_info{schedule!="none"}
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: 'Job {{ $labels.job_name }} on {{ $labels.instance }} has not run for more than 26 hours'

      # Fill level from free / capacity, never from usedSpace (backup files only).
      - alert: VeeamRepositoryFull
        expr: (1 - veeam_repository_free_bytes / veeam_repository_capacity_bytes) > 0.85 and veeam_repository_capacity_bytes > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: 'Repository {{ $labels.repository }} on {{ $labels.instance }} is {{ $value | humanizePercentage }} full'

      - alert: VeeamRepositoryOffline
        expr: veeam_repository_online == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: 'Repository {{ $labels.repository }} on {{ $labels.instance }} is offline'

      # Also fires once the license has expired ($value is negative then).
      - alert: VeeamLicenseExpiring
        expr: (veeam_license_expiration_timestamp_seconds - time()) / 86400 < 30
        labels:
          severity: warning
        annotations:
          summary: '{{ if lt $value 0.0 }}Veeam license on {{ $labels.instance }} has expired{{ else }}Veeam license on {{ $labels.instance }} expires in {{ printf "%.0f" $value }} days{{ end }}'

      # A collector replaces its file only on success, so an old file means
      # failed or missing runs. REST task: every 15 minutes.
      - alert: VeeamExporterStale
        expr: time() - windows_textfile_mtime_seconds{file=~".*veeam_(jobs|objects|repositories)\\.prom"} > 3600
        labels:
          severity: warning
        annotations:
          summary: 'Veeam exporter file {{ $labels.file }} on {{ $labels.instance }} is older than 1 hour'

      # License task: once a day.
      - alert: VeeamExporterLicenseStale
        expr: time() - windows_textfile_mtime_seconds{file=~".*veeam_license\\.prom"} > 2 * 86400
        labels:
          severity: warning
        annotations:
          summary: 'Veeam license file on {{ $labels.instance }} is older than 2 days'
